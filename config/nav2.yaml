# Nav2 for a hovering multirotor with a forward depth camera.
#
# Three things make this different from a ground robot, and each one is a
# decision rather than a default:
#
# 1. There is no map and no localisation. PX4's EKF already gives metric
#    odometry, so the global frame is `odom`, not `map`, and there is no
#    AMCL, no map_server and no static layer. Nav2 works this way but every
#    tutorial assumes otherwise, so every frame below says odom on purpose.
#
# 2. Nav2 is 2D. The aircraft flies at an altitude the planner knows nothing
#    about: it plans in the horizontal plane and altitude stays with the
#    software pilot. A wall that stops short of the aircraft's height is
#    still an obstacle as far as this is concerned.
#
# 3. The costmap sees a 73 degree forward arc, not 360. Anything outside it
#    is unknown rather than clear, so the robot cannot be trusted to plan
#    through space it has never looked at. Hence rolling windows, a short
#    horizon and no attempt at a global map of the world.

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: True
      rolling_window: true
      width: 20
      height: 20
      resolution: 0.1
      # A multirotor is round, so a radius rather than a footprint polygon.
      # 0.3 m is the x500 airframe, not the propeller tips.
      robot_radius: 0.3
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        # Height is checked in the ODOM frame, at the layer AND the source.
        # The default of 2.0 silently discards every observation from an
        # aircraft at 6 m, so the costmap only ever learned the world during
        # moments below 2 m. Measured: 135 scan beams on a wall at 9.9 m and
        # a lethal count that did not move for 18 s. The slab that actually
        # selects relevant heights is pointcloud_to_laserscan's, relative to
        # base_link, so these just have to be out of the way.
        min_obstacle_height: -10.0
        max_obstacle_height: 100.0
        observation_sources: scan
        scan:
          topic: /scan
          min_obstacle_height: -10.0
          max_obstacle_height: 100.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 18.0
          raytrace_min_range: 0.0
          obstacle_max_range: 15.0
          obstacle_min_range: 0.0
          inf_is_valid: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        # Must exceed robot_radius (0.3) or the planner will graze walls, but
        # keep it tight: at 1.2 m the aircraft ends up sitting inside inflated
        # space when it rounds the end of a wall. Measured with MPPI, the
        # first controller: every sample then scored as a collision and it
        # aborted with "Optimizer fail to compute path". Pure pursuit's own
        # collision check refuses to drive from inside inflated space the
        # same way. PX4's braking is the backstop for the margin this gives up.
        inflation_radius: 0.75
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: True
      # Rolling, because there is no map. The planner only ever reasons about
      # the neighbourhood the camera has actually seen.
      rolling_window: true
      width: 50
      height: 50
      resolution: 0.1
      robot_radius: 0.3
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        # Height is checked in the ODOM frame, at the layer AND the source.
        # The default of 2.0 silently discards every observation from an
        # aircraft at 6 m, so the costmap only ever learned the world during
        # moments below 2 m. Measured: 135 scan beams on a wall at 9.9 m and
        # a lethal count that did not move for 18 s. The slab that actually
        # selects relevant heights is pointcloud_to_laserscan's, relative to
        # base_link, so these just have to be out of the way.
        min_obstacle_height: -10.0
        max_obstacle_height: 100.0
        observation_sources: scan
        scan:
          topic: /scan
          min_obstacle_height: -10.0
          max_obstacle_height: 100.0
          # clearing FALSE here, unlike the local costmap, and this is the
          # difference between planning around a wall and planning through it.
          # The camera sees a 73 degree arc. With clearing on, every cell the
          # scan no longer covers gets raytraced clear, so the moment the nose
          # turns away the wall is forgotten and the global planner produces a
          # straight line through it. Measured: a 7.0 m plan for a 6.9 m
          # straight-line goal with a wall in between.
          # Cost of this: obstacles are never unlearned, so a moving obstacle
          # leaves a permanent ghost. Acceptable in a static world, and the
          # local costmap below still clears, so the controller stays reactive.
          clearing: False
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 18.0
          obstacle_max_range: 15.0
          inf_is_valid: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.75
      always_send_full_costmap: True

planner_server:
  ros__parameters:
    use_sim_time: True
    # 2 Hz, not 1. The camera marks new wall cells as the aircraft
    # approaches, and the controller aborts if the current path crosses
    # one before the next replan moves it. Replanning faster halves
    # that window.
    expected_planner_frequency: 2.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.6
      use_astar: true
      # false: a multirotor can fly diagonally, it is not differential drive.
      allow_unknown: false

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 20.0
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.6
      yaw_goal_tolerance: 6.28     # heading is the pilot's job, not Nav2's
      stateful: True
    FollowPath:
      # Regulated Pure Pursuit, not MPPI.
      #
      # MPPI was tried first and is the better theoretical fit: it samples
      # candidate trajectories and handles a holonomic vehicle natively. In
      # practice it repeatedly collapsed to commanding nothing. Three separate
      # stall points were measured, each after a different round of critic
      # tuning: a metre short of a wall, at the end of a wall, and at the
      # corner it was trying to round, every time with the commanded velocity
      # decaying to under 0.05 m/s while a valid 17 m plan sat unused. That is
      # MPPI's known failure mode when obstacle costs dominate the sample set,
      # and tuning moved the stall rather than removing it.
      #
      # Pure pursuit cannot fail that way: it geometrically chases a point on
      # the path, so there is no optimisation to collapse. It is written for
      # differential drive and turns to face the path before driving, which
      # happens to suit this aircraft, because the pilot already slaves the
      # heading to the direction of travel so the camera looks where it goes.
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 1.5
      lookahead_dist: 2.5
      min_lookahead_dist: 1.0
      max_lookahead_dist: 4.0
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: true
      transform_tolerance: 0.2
      min_approach_linear_velocity: 0.15
      approach_velocity_scaling_dist: 1.0
      # Slow down near obstacles rather than refusing to move.
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 1.0
      regulated_linear_scaling_min_speed: 0.3
      # No reversing: a flying aircraft backing up blind is worse than stopping.
      allow_reversing: false
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.6
      max_angular_accel: 2.0
      max_robot_pose_search_dist: 10.0
      # Collision checking ahead on the path, so it still refuses to drive
      # into something even though it is not optimising over obstacles.
      use_collision_detection: true
      # 1.0 s, not 1.5. This is how far ahead along the path pure pursuit
      # checks for a collision before refusing to continue. Longer means
      # more refusals on cells the planner has not yet routed around.
      max_allowed_time_to_collision_up_to_carrot: 1.0

bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: odom
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    # Nav2's DEFAULT tree calls the Spin and BackUp recovery behaviours, and
    # the behaviour_server above does not load them, on purpose: a flying
    # aircraft spinning or reversing blindly is worse than stopping. With the
    # default tree the load then fails outright and the lifecycle manager
    # stops there, taking bt_navigator and velocity_smoother with it.
    # This tree replans on a timer and calls no recoveries.
    #
    # nav2.launch.py OVERRIDES this with the bundled config/avoidance_bt.xml,
    # whose installed path only the launch file knows. This value is the
    # fallback for anyone running bt_navigator with just this file.
    # It must be set HERE, at the top level. Jazzy also declares
    # navigate_to_pose.default_nav_to_pose_bt_xml, and setting only that one
    # is silently ignored: the plugin-scoped value is accepted and the
    # top-level default is what actually gets loaded.
    default_nav_to_pose_bt_xml:
      "/opt/ros/jazzy/share/nav2_bt_navigator/behavior_trees/navigate_w_replanning_time.xml"
    navigators: ["navigate_to_pose"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"

behavior_server:
  ros__parameters:
    use_sim_time: True
    local_costmap_topic: local_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_costmap_topic: global_costmap/costmap_raw
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    # No spin or back-up: those are ground-robot recoveries and a flying
    # aircraft reversing blindly is worse than stopping.
    behavior_plugins: ["wait"]
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.2

velocity_smoother:
  ros__parameters:
    use_sim_time: True
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [2.0, 2.0, 1.0]
    min_velocity: [-1.0, -2.0, -1.0]
    max_accel: [1.5, 1.5, 2.0]
    max_decel: [-1.5, -1.5, -2.0]
    odom_topic: "/odom"
    odom_duration: 0.1
